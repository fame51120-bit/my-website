<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Face Scan</title><style>body{background:#0f172a;color:#fff;text-align:center;font-family:sans-serif;padding:20px}.card{background:#1e293b;max-width:480px;margin:auto;padding:20px;border-radius:20px}video{width:100%;border-radius:12px;background:#000;transform:scaleX(-1)}canvas{position:absolute;top:0;left:0;width:100%;height:100%;transform:scaleX(-1)}.wrap{position:relative}button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:12px;font-size:18px;font-weight:bold}.g{background:#22c55e}.b{background:#3b82f6;color:#fff}</style></head><body><h1>📸 Face Scan</h1><div class="card"><div class="wrap"><video id="v" autoplay muted playsinline></video><canvas id="c"></canvas></div><div id="s" style="margin-top:10px">กำลังโหลด...</div><button class="g" onclick="start()">เปิดกล้อง</button><button class="b" onclick="det()">สแกน</button></div><script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script><script>const v=document.getElementById('v'),c=document.getElementById('c'),s=document.getElementById('s');async function load(){await faceapi.nets.tinyFaceDetector.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models');await faceapi.nets.faceLandmark68Net.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models');s.innerText='พร้อม';}load();async function start(){v.srcObject=await navigator.mediaDevices.getUserMedia({video:true});}async function det(){const d=await faceapi.detectAllFaces(v,new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks();const dim=faceapi.matchDimensions(c,v,true);const r=faceapi.resizeResults(d,dim);c.getContext('2d').clearRect(0,0,c.width,c.height);faceapi.draw.drawDetections(c,r);faceapi.draw.drawFaceLandmarks(c,r);s.innerText=d.length?`เจอ ${d.length} คน`:'ไม่เจอ';}</script></body></html>
